function toast(msg, kind='ok'){
  const el=document.createElement('div');
  el.className='anim-toast pointer-events-auto flex items-start gap-3 rounded-xl bg-ink text-white pl-3.5 pr-4 py-3.5 text-[14.5px] shadow-[0_12px_32px_rgba(16,24,40,.25)] max-w-sm';
  el.innerHTML=`<span class="mt-0.5 ${kind==='ok'?'text-brand-300':kind==='warn'?'text-amber-400':'text-[#9DB7FF]'}">${ic(kind==='ok'?'checkc':kind==='warn'?'alert':'info','w-5 h-5')}</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(),4000);
}

function pubCatalog(){
  const f=S.catFilter, view=curTab('cat','items');
  let list=PRODUCTS.filter(p=>(f.kind==='all'||p.kind===f.kind)&&(f.cat==='all'||p.cat===f.cat)&&(!f.verified||co(p.sup).verified)&&(!f.invoice||p.invoice));

function newWiz(r, prefill){

function wizValidate(step){
  const w=S.wiz, e={};
  if(step===1){
    if((w.title||'').trim().length<5) e.title='Напишите название — хотя бы 5 символов';
    if(!w.cat) e.cat='Выберите категорию — так заявку увидят нужные поставщики';
    w.items.forEach((it,i)=>{ if((it.name||'').trim().length<3) e['in'+i]='Опишите позицию'; if(!(Number(it.qty)>0)) e['iq'+i]='Количество больше нуля'; });
  }
  if(step===2){
    if(w.budget!==''&&!(Number(w.budget)>0)) e.budget='Сумма должна быть больше нуля или оставьте поле пустым';
    if((w.delivery||'').trim().length<5) e.delivery='Укажите адрес доставки';
    if(!w.deadline) e.deadline='Укажите, до какого числа принимать КП';
    else if(daysLeft(w.deadline)<1) e.deadline='Дата должна быть не раньше завтрашнего дня';
  }
  return e;
}

function needLogin(what,id){
  if(!S.loggedIn){ S.afterLogin=[what,id]; S.login=null; S.view='public'; go('login'); return; }
  doAfter(what,id);
}
function doAfter(what,id){
  if(what==='rfqnew'){ S.view='buyer'; A.wiz('new'); }
  else if(what==='rfqfrom'){ const p=prod(id); S.view='buyer'; S.wiz=newWiz(null,{title:p.title,cat:p.cat,kind:p.kind,items:[{name:p.title,qty:String(Math.max(S.qty[id]||p.moq,p.moq)),unit:p.unit}]}); S.wizStep=1; S.wizErr={}; go('rfqnew'); }
  else if(what==='buy'){ S.view='public'; S.page='product'; S.param=id; S.modal={type:'buy',id}; render(); }
  else if(what==='chat'){ S.view='buyer'; A.chatwith(id); }
  else if(what==='heroRfq'){ S.view='buyer'; go('rfqnew'); }
  else { S.view='buyer'; go('home'); }
}
function newDeal(o){ const d={id:'d'+(DEALS.length+1)+'_'+Date.now()%1000,no:'БМ‑'+(2061+DEALS.length),created:'2026-09-26',due:'2026-10-06',stage:0,...o}; DEALS.unshift(d); DOCS.unshift({id:'doc'+Date.now(),deal:d.id,type:'Договор',no:d.no.replace('БМ‑','')+'/Д',date:'2026-09-26',status:'wait'}); return d; }
function saveWiz(status){ const w=S.wiz; let r=w.id?rfq(w.id):null; const data={title:w.title||'Без названия',cat:w.cat,kind:w.kind,items:w.items.map(i=>({name:i.name,qty:Number(i.qty)||0,unit:i.unit})),note:w.note,budget:w.budget===''?null:Number(w.budget),deadline:w.deadline,delivery:w.delivery,pay:w.pay,status}; if(status==='quotes') data.published='2026-09-26';
  if(r) Object.assign(r,data); else { r={id:'r'+Date.now(),no:'З‑'+(1202+RFQS.length),buyer:'somon',...data}; RFQS.unshift(r); } return r.id; }

  const t=e.target, d=t.dataset;
  if(d.bind&&S.wiz) S.wiz[d.bind]=t.value;
  if(d.item&&S.wiz){ const [i,k]=d.item.split(':'); S.wiz.items[Number(i)][k]=t.value; }
  if(d.qf&&S.quoteDraft) S.quoteDraft[d.qf]=t.value;
  if(d.pb&&S.prodDraft){ S.prodDraft[d.pb]=t.value; if(d.pb==='unit') render(); }
  if(d.pbc&&S.prodDraft) S.prodDraft[d.pbc]=t.checked;
  if(d.cf){ S.catFilter[d.cf]=t.type==='checkbox'?t.checked:t.value; render(); }
  if(d.qty){ const p=prod(d.qty); S.qty[d.qty]=Math.max(p.moq,Number(t.value)||p.moq); render(); }
  if(d.pkg){ const [id,i]=d.pkg.split(':'); S.qty[id+'pkg']=Number(i); render(); }
  if(d.vchk){ const [c,i]=d.vchk.split(':'); VERIF.find(x=>x.co===c).checks[Number(i)]=t.checked; render(); }
  if(d.rule){ S.tab[d.rule]=t.checked; toast('Правило сохранено'); }
  if(d.catname){ const c=CATEGORIES.find(x=>x.id===d.catname), v=t.value.trim(); if(v.length>=3&&v!==c.name){ c.name=v; audit(`Переименовал категорию в «${v}»`); toast('Категория переименована — изменения видны везде'); } else t.value=c.name; }
  if(d.files){ const names=[...t.files].map(f=>f.name); S._files=names; const el=document.getElementById(d.files); if(el) el.textContent='— '+names.join(', '); else toast(`Прикреплено файлов: ${names.length}`); }
  if(d.arf&&S.app&&S.app.rf) S.app.rf[d.arf]=t.value;
  if(d.anotif!=null&&S.app){ S.app.notif=t.checked; toast(t.checked?'Уведомления включены':'Уведомления выключены','info'); }
  if(d.abio!=null&&S.app){ S.app.bio=t.checked; toast(t.checked?'Face ID включён':'Face ID выключен','info'); }
});
document.addEventListener('keydown', e=>{
  const id=e.target.id;
  if(e.key==='Escape'&&(S.modal||S.menu||S.navOpen||(S.app&&S.app.sheet))){ S.modal=null; S.menu=null; S.navOpen=false; if(S.app) S.app.sheet=null; render(); return; }
  if(e.key!=='Enter') return;
  if(id==='pub-q') A.pubsearch();
  if(id==='hero-q') A.herosearch();
  if(id==='cab-q'){ S.q=e.target.value.trim(); go({buyer:'rfqs',supplier:'leads',admin:'users'}[S.view]); }
  if(id==='msg-in'&&S.thread) A.msend(S.thread);
  if(id==='amsg'){ const top=S.app.stack[S.app.stack.length-1]; if(top&&top[0]==='chat') A.amsend(top[1]); }
  if(id==='cat-new') A.catadd();
  if(id==='l-id') A.lsend();
  if(id==='l-code') A.lverify();
  if(id==='app-phone') A.asendcode();
  if(id==='m-sms'&&S.modal){ const b=document.querySelector('.sticky.bottom-0 button:last-child'); b&&b.click(); }
});

  return aTopHome()+`<div class="pb-28"><div class="grid grid-cols-2 gap-2 px-4 pt-4"><div class="rounded-2xl bg-white border border-line p-4"><span class="text-[12.5px] text-mute">Можно вывести</span><div class="text-[20px] font-extrabold text-brand-700 mt-0.5 tnum">${num(SUPFIN.balance)} TJS</div></div><div class="rounded-2xl bg-white border border-line p-4"><span class="text-[12.5px] text-mute">Придёт после приёмки</span><div class="text-[20px] font-extrabold mt-0.5 tnum">${num(incoming)} TJS</div></div></div>
    ${aSection('Нужно ваше действие')}<div class="px-4 grid gap-2">${[...DEALS.filter(d=>d.sup==='techno'&&NEEDS.supplier.includes(d.stage)).map(d=>({hot:true,icon:'briefcase',title:NEXT.supplier[d.stage],text:`${d.no} · ${esc(d.title)}`,act:`apush:deal:${d.id}`})),...fresh.map(r=>({hot:true,icon:'file',title:`Новая заявка: ответьте ценой`,text:`${esc(r.title)} · ${tjs(r.budget)}`,act:`apush:lead:${r.id}`})),...THREADS.supplier.filter(t=>t.unread).map(t=>({icon:'chat',title:`Вопрос от ${co(t.with).name}`,text:esc(t.msgs[t.msgs.length-1].t),act:`apush:chat:${t.id}`}))].map(aTodo).join('')}</div>
    ${aSection('Сделки')}<div class="px-4 grid gap-2">${DEALS.filter(d=>d.sup==='techno').map(d=>dealRow(d,'supplier')).join('')}</div></div>`;
}
function aTodo(t){ return `<button data-a="${t.act}" class="w-full text-left flex items-center gap-3 rounded-2xl border ${t.hot?'border-brand-200 bg-brand-50/60':'border-line bg-white'} p-3.5"><span class="w-10 h-10 rounded-xl ${t.hot?'bg-brand-600 text-white':'bg-canvas'} grid place-items-center shrink-0">${ic(t.icon,'w-5 h-5')}</span><span class="flex-1 min-w-0"><b class="block text-[14.5px] leading-snug">${t.title}</b><span class="block text-[12.5px] text-mute truncate">${t.text}</span></span>${ic('right','w-5 h-5 text-mute shrink-0')}</button>`; }
const appCard = p => { const s=co(p.sup); return `<button data-a="apush:prod:${p.id}" class="text-left bg-white rounded-2xl border border-line overflow-hidden flex flex-col"><span class="block aspect-[4/3]">${prodArt(p,'h-full')}</span><span class="p-3 grid gap-1"><span class="text-[13px] font-semibold leading-snug line-clamp-2 min-h-[34px]">${esc(p.title)}</span><span><span class="text-[11.5px] text-mute">от </span><b class="text-[16px] font-extrabold tnum">${num(fromPrice(p))}</b> <span class="text-[11.5px] text-mute">TJS/${p.unit}</span></span><span class="text-[11.5px] ${s.verified?'text-brand-700':'text-amber-700'} font-semibold inline-flex items-center gap-1">${ic(s.verified?'shieldok':'clock','w-3.5 h-3.5')}${esc(s.name)}</span></span></button>`; };
function tabCatalog(){
  const a=A_(); let list=PRODUCTS.filter(p=>(a.cat==='all'||p.cat===a.cat)&&(!a.catQ||(p.title+co(p.sup).name).toLowerCase().includes(a.catQ.toLowerCase())));
  return `<div class="bg-white px-4 pt-3 pb-3 sticky top-0 z-10 grid gap-3 border-b border-line"><b class="text-[24px] font-extrabold tracking-[-0.02em]">Каталог</b><label class="relative"><span class="sr-only">Поиск</span><input id="app-catq" data-alive="catQ" value="${esc(a.catQ)}" placeholder="Что нужно купить?" class="w-full h-12 rounded-xl bg-canvas border border-transparent pl-11 pr-4 text-[15.5px] outline-none focus:bg-white focus:border-brand-600"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-mute">${ic('search','w-5 h-5')}</span></label>
    <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">${[['all','Все'],...CATEGORIES.map(c=>[c.id,c.name])].map(([k,t])=>`<button data-a="acat:${k}" class="shrink-0 h-9 px-3.5 rounded-xl text-[13.5px] font-semibold ${a.cat===k?'bg-ink text-white':'bg-canvas'}">${t}</button>`).join('')}</div></div>
  <div class="p-3 pb-28 grid grid-cols-2 gap-2">${list.map(appCard).join('')||`<p class="col-span-2 text-mute text-center py-10">Ничего не нашли</p>`}</div>`;
}
function pushProd(id){
  const a=A_(), p=prod(id), s=co(p.sup), q=Math.max(a.qty[id]||p.moq,p.moq), pr=priceFor(p,q);
  return aHead('','aback',`<button data-a="toast:Добавлено в избранное" class="w-10 h-10 grid place-items-center" aria-label="В избранное">${ic('heart')}</button>`)+`<div class="pb-36">
   <div class="aspect-[4/3]">${prodArt(p,'h-full')}</div>
   <div class="bg-white p-4 grid gap-4 border-b border-line">
     <h1 class="text-[18px] leading-snug font-extrabold tracking-[-0.01em]">${esc(p.title)}</h1>
     <button data-a="toast:Страница поставщика" class="flex items-center gap-3 text-left">${avatar(s,'w-10 h-10 text-[12px]')}<span class="flex-1 min-w-0"><b class="block text-[14.5px] truncate">${esc(s.name)}</b>${verified(s,true)}</span>${ic('right','w-5 h-5 text-mute')}</button>
     <div class="grid gap-2"><span class="text-[13.5px] font-semibold">Цена зависит от количества</span><div class="rounded-xl border border-line divide-y divide-line">${p.tiers.map(([f,v],i)=>{const to=p.tiers[i+1]?p.tiers[i+1][0]-1:null,on=q>=f&&(to==null||q<=to);return `<div class="flex justify-between px-3.5 py-2.5 text-[14.5px] ${on?'bg-brand-50':''}"><span class="${on?'font-bold':''}">${f}${to?'–'+to:' и больше'} ${p.unit}</span><b class="tnum ${on?'text-brand-700':''}">${num(v)} TJS</b></div>`}).join('')}</div></div>
     <div class="flex items-center justify-between"><span class="text-[14.5px] font-semibold">Количество</span><div class="flex items-center h-11 border border-line rounded-xl"><button data-a="aqty:${id}:-" class="w-11 grid place-items-center" aria-label="Меньше">${ic('minus','w-4 h-4')}</button><span class="w-12 text-center text-[16px] font-bold tnum">${q}</span><button data-a="aqty:${id}:+" class="w-11 grid place-items-center" aria-label="Больше">${ic('plus','w-4 h-4')}</button></div></div>
     <div class="rounded-xl bg-brand-50 p-3.5 flex gap-3 text-[13px]"><span class="text-brand-700">${ic('lock','w-5 h-5')}</span><span><b class="block text-[14px]">Покупка под защитой</b>Поставщик получит деньги после вашей приёмки</span></div>
   </div>
   <dl class="mt-2 bg-white border-y border-line divide-y divide-line">${p.specs.slice(0,4).map(([k,v])=>`<div class="flex justify-between gap-3 px-4 py-3 text-[13.5px]"><dt class="text-mute">${k}</dt><dd class="text-right font-medium">${v}</dd></div>`).join('')}</dl></div>
   <div class="absolute left-0 right-0 bottom-0 bg-white border-t border-line px-4 pt-3 pb-7 flex items-center gap-3 z-20"><div class="min-w-0"><span class="text-[12px] text-mute">Итого</span><div class="text-[19px] font-extrabold leading-tight tnum">${num(pr*q)} TJS</div></div><button data-a="asheet:buy:${id}" class="flex-1 h-12 rounded-xl bg-brand-600 text-white text-[15px] font-bold inline-flex items-center justify-center gap-2">${ic('shieldok','w-5 h-5')}Купить</button></div>`;
}

/* ---------- гайд ---------- */
function guideHtml(){
  const sw=(n,h,u)=>`<div class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl border border-line" style="background:${h}"></span><span class="text-[13.5px]"><b>${n}</b> <span class="text-mute">${h}</span><br><span class="text-mute">${u}</span></span></div>`;
  return `<p class="text-[15px]">Строгий современный стиль: графит + один зелёный акцент, белые карточки на светлом фоне, крупный читаемый шрифт. Всё рассчитано на людей без технического опыта.</p>
  <div class="grid gap-2">${label('Цвета')}<div class="grid sm:grid-cols-2 gap-3">${sw('ink','#16181D','текст, тёмные блоки, логотип')}${sw('brand-600','#0E8A5E','главное действие, «защищено», выбранное')}${sw('verify-600','#2453C6','статусы «отправлено», «на гарантии»')}${sw('canvas','#F5F6F8','фон страниц')}${sw('line','#E4E7EC','границы')}${sw('mute','#5F6672','подписи')}</div></div>
  <div class="grid gap-1">${label('Шрифт и размеры')}<p class="text-[14px]">Manrope. Основной текст 15–16 px, заголовок страницы 28 px, кнопки и поля высотой 44–48 px — удобно попадать пальцем и мышью. Скругления 10–16 px.</p></div>
  <div class="grid gap-1">${label('Правила понятности')}<ul class="list-disc pl-5 text-[14px] grid gap-1"><li>Одно главное (зелёное) действие на экране.</li><li>Простые слова: «Принять заказ», «Есть проблема», «Цена зависит от количества».</li><li>У сложных терминов — подсказка «Что это?» / «Как это работает?».</li><li>На главной кабинета — «Нужно ваше действие»: человек сразу видит, что делать.</li><li>Каждый статус — цветная точка + слово, а не только цвет.</li><li>На телефоне у кабинетов нижнее меню из 5 пунктов, как в приложении.</li><li>Частые вопросы на главной и на странице гарантии.</li></ul></div>
  <div class="grid gap-1">${label('Сущности API')}<p class="text-[13px]">COMPANIES · CATEGORIES · PRODUCTS · RFQS · QUOTES · DEALS · APPROVALS · EMPLOYEES · DOCS · PAYMENTS · THREADS · PAYOUTS · VERIF · DISPUTES · USERS · AUDIT</p></div>`;
}

/* ---------- новые действия ---------- */
Object.assign(A,{
  cfb:k=>{ S.catFilter[k]=!S.catFilter[k]; render(); },
  variant:(id,i)=>{ S.qty[id+'v']=Number(i); render(); },
  acatgo:k=>{ S.app.cat=k; S.app.tab='catalog'; S.app.stack=[]; render(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pub-q-m'){ S.catFilter.q=e.target.value.trim(); S.catFilter.cat='all'; S.catFilter.kind='all'; S.menu=null; go('catalog'); } });

</script>

</body>
